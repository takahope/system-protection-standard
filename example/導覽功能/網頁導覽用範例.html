<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>低複雜度網站導覽系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        
        /* 
          利用 box-shadow 創造反向遮罩 (挖洞效果)
          這樣做的好處是只要一個 div 就能達成全螢幕遮罩加上特定區域的高亮，降低 DOM 結構複雜度。
        */
        .tour-highlight {
            position: absolute;
            border-radius: 8px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.7);
            transition: all 0.4s ease-in-out;
            pointer-events: none; /* 讓滑鼠可以穿透高亮區 (如果需要的話) */
            z-index: 9998;
        }

        /* 導覽提示框的動畫與層級 */
        .tour-tooltip-container {
            position: absolute;
            z-index: 9999;
            transition: all 0.4s ease-in-out;
            opacity: 0;
            visibility: hidden;
        }

        .tour-tooltip-container.active {
            opacity: 1;
            visibility: visible;
        }

        /* 箭頭浮動動畫，吸引使用者目光 */
        @keyframes bounce-horizontal {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(-10px); }
        }
        @keyframes bounce-vertical {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .arrow-animate-left { animation: bounce-horizontal 1.5s infinite; }
        .arrow-animate-top { animation: bounce-vertical 1.5s infinite; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

    <div class="max-w-4xl mx-auto p-6 pt-12">
        <header class="flex justify-between items-center mb-12 border-b pb-4">
            <h1 class="text-3xl font-bold text-gray-900">系統儀表板</h1>
            <!-- 導覽目標 1 -->
            <button id="btn-profile" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow transition">
                用戶設定
            </button>
        </header>

        <main class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h2 class="text-xl font-semibold mb-4">資料管理</h2>
                <p class="text-gray-500 mb-6">在這裡管理您的日常營運數據。</p>
                <!-- 導覽目標 2 -->
                <button id="btn-add-data" class="bg-green-500 hover:bg-green-600 text-white px-5 py-2.5 rounded-lg shadow-sm transition w-full">
                    + 新增資料
                </button>
            </section>

            <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h2 class="text-xl font-semibold mb-4">報表匯出</h2>
                <p class="text-gray-500 mb-6">將您的數據匯出為 PDF 或 Excel。</p>
                <!-- 導覽目標 3 -->
                <button id="btn-export" class="bg-purple-500 hover:bg-purple-600 text-white px-5 py-2.5 rounded-lg shadow-sm transition w-full">
                    匯出報表
                </button>
            </section>
        </main>

        <div class="mt-12 text-center">
            <!-- 重新啟動導覽的按鈕 -->
            <button id="btn-restart-tour" class="text-gray-500 underline hover:text-gray-800">
                重新播放導覽
            </button>
        </div>
    </div>

    <!-- 導覽系統的 DOM 元素 (預設隱藏) -->
    <div id="tour-overlay-container" class="fixed inset-0 hidden" style="z-index: 9997;">
        <!-- 攔截點擊的透明層，防止使用者在導覽期間亂點 -->
        <div class="absolute inset-0 z-[9997] cursor-not-allowed"></div>
        
        <!-- 挖洞高亮層 -->
        <div id="tour-highlight" class="tour-highlight bg-transparent border-2 border-white"></div>
        
        <!-- 提示對話框與箭頭 -->
        <div id="tour-tooltip" class="tour-tooltip-container flex gap-4">
            <!-- 箭頭 SVG (動態旋轉與擺放) -->
            <div id="tour-arrow-wrapper" class="flex items-center justify-center">
                <svg id="tour-arrow" class="w-8 h-8 text-white drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                </svg>
            </div>
            
            <!-- 文字框 -->
            <div class="bg-white rounded-xl shadow-2xl p-5 w-64 border border-gray-100">
                <h3 id="tour-title" class="font-bold text-lg text-gray-900 mb-1">標題</h3>
                <p id="tour-content" class="text-gray-600 text-sm mb-4">這裡放說明文字。</p>
                <div class="flex justify-between items-center mt-2">
                    <span id="tour-counter" class="text-xs text-gray-400 font-medium">1 / 3</span>
                    <button id="tour-next-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-md text-sm transition shadow-sm">
                        下一步
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * TourGuide 類別
         * 原則：高內聚 (只負責導覽的渲染與切換邏輯)，低耦合 (不綁死特定 DOM，步驟透過參數傳入)
         */
        class TourGuide {
            constructor(steps) {
                this.steps = steps;
                this.currentIndex = 0;
                this.isActive = false;

                // 快取 DOM 元素以提高效能與可讀性
                this.dom = {
                    container: document.getElementById('tour-overlay-container'),
                    highlight: document.getElementById('tour-highlight'),
                    tooltip: document.getElementById('tour-tooltip'),
                    title: document.getElementById('tour-title'),
                    content: document.getElementById('tour-content'),
                    counter: document.getElementById('tour-counter'),
                    nextBtn: document.getElementById('tour-next-btn'),
                    arrowWrapper: document.getElementById('tour-arrow-wrapper'),
                    arrow: document.getElementById('tour-arrow')
                };

                // 綁定事件以避免 this 指向遺失 (Bind context)
                this.nextStep = this.nextStep.bind(this);
                this.handleResize = this.handleResize.bind(this);

                // 初始化事件監聽
                this.dom.nextBtn.addEventListener('click', this.nextStep);
            }

            /**
             * 啟動導覽
             */
            start() {
                if (this.steps.length === 0) return; // Guard clause
                
                this.currentIndex = 0;
                this.isActive = true;
                this.dom.container.classList.remove('hidden');
                
                // 處理視窗縮放以重新計算位置
                window.addEventListener('resize', this.handleResize);
                
                // 為了讓 display:block 生效後再執行 transition，給予微小延遲
                setTimeout(() => this.renderStep(), 50);
            }

            /**
             * 關閉導覽
             */
            close() {
                this.isActive = false;
                this.dom.tooltip.classList.remove('active');
                
                setTimeout(() => {
                    this.dom.container.classList.add('hidden');
                }, 400); // 等待淡出動畫結束

                window.removeEventListener('resize', this.handleResize);
            }

            /**
             * 切換到下一步
             */
            nextStep() {
                this.currentIndex++;
                if (this.currentIndex >= this.steps.length) {
                    this.close();
                } else {
                    this.renderStep();
                }
            }

            /**
             * 當視窗大小改變時，重新定位目前步驟
             */
            handleResize() {
                if (!this.isActive) return;
                this.renderStep();
            }

            /**
             * 核心渲染邏輯：依據當前步驟的設定更新畫面
             * 降低複雜度：將位置計算封裝進 _updatePosition，文字更新在此處理。
             */
            renderStep() {
                const stepConfig = this.steps[this.currentIndex];
                const targetElement = document.querySelector(stepConfig.selector);

                // 防呆機制 (Guard Clause)：如果找不到目標元素，直接跳下一步
                if (!targetElement) {
                    console.warn(`TourGuide: 找不到元素 ${stepConfig.selector}`);
                    this.nextStep();
                    return;
                }

                // 1. 更新內容
                this.dom.title.textContent = stepConfig.title;
                this.dom.content.textContent = stepConfig.content;
                this.dom.counter.textContent = `${this.currentIndex + 1} / ${this.steps.length}`;
                
                // 最後一步時改變按鈕文字
                this.dom.nextBtn.textContent = (this.currentIndex === this.steps.length - 1) ? '完成' : '下一步';

                // 2. 更新位置與動畫方向
                this._updatePosition(targetElement, stepConfig.placement || 'left');

                // 3. 顯示提示框
                this.dom.tooltip.classList.add('active');
                
                // 4. 將目標元素捲動到畫面中 (平滑捲動)
                targetElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            /**
             * 輔助函式：計算高亮框與提示框的位置 (降低主函式的認知負擔)
             * @param {HTMLElement} element - 目標 DOM 元素
             * @param {string} placement - 提示框出現的位置 ('left', 'bottom')
             */
            _updatePosition(element, placement) {
                // 取得目標元素在可視區域中的座標與尺寸
                const rect = element.getBoundingClientRect();
                const padding = 8; // 高亮框比元素大一點的內距

                // 設定高亮挖洞區塊的位置與大小
                this.dom.highlight.style.top = `${rect.top - padding}px`;
                this.dom.highlight.style.left = `${rect.left - padding}px`;
                this.dom.highlight.style.width = `${rect.width + padding * 2}px`;
                this.dom.highlight.style.height = `${rect.height + padding * 2}px`;

                // 重置箭頭動畫與方向
                this.dom.arrowWrapper.className = 'flex items-center justify-center'; // 清除之前的動畫 class
                
                // 根據 placement 決定 Tooltip 的位置與箭頭方向
                if (placement === 'left') {
                    // Tooltip 放在元素左邊
                    this.dom.tooltip.style.flexDirection = 'row';
                    this.dom.arrow.style.transform = 'rotate(0deg)'; // 箭頭朝右 (指向元素)
                    this.dom.arrowWrapper.classList.add('arrow-animate-left');
                    
                    // 估算 tooltip 寬度大約 320px
                    this.dom.tooltip.style.top = `${rect.top + (rect.height / 2) - 60}px`; 
                    this.dom.tooltip.style.left = `${rect.left - 330}px`;
                } else if (placement === 'bottom') {
                    // Tooltip 放在元素下方
                    this.dom.tooltip.style.flexDirection = 'col';
                    this.dom.tooltip.classList.remove('flex-row');
                    this.dom.tooltip.classList.add('flex-col');
                    this.dom.arrow.style.transform = 'rotate(270deg)'; // 箭頭朝上 (指向元素)
                    this.dom.arrowWrapper.classList.add('arrow-animate-top');
                    
                    this.dom.tooltip.style.top = `${rect.bottom + 20}px`;
                    this.dom.tooltip.style.left = `${rect.left + (rect.width / 2) - 150}px`;
                }
            }
        }

        /**
         * 依賴注入 (Dependency Injection) 的概念實踐：
         * 步驟設定與引擎分離。這裡我們定義劇本，然後傳給 TourGuide。
         * 若未來要增加步驟，只需修改這個 Array，不需要改動 TourGuide 內部的演算法。
         */
        const myTourSteps = [
            {
                selector: '#btn-profile',
                title: '設定您的帳戶',
                content: '第一次使用嗎？請先點擊這裡設定您的個人資料與偏好。',
                placement: 'left' // 提示框在元素左側，箭頭向右指
            },
            {
                selector: '#btn-add-data',
                title: '開始新增資料',
                content: '設定完畢後，您可以從這裡建立第一筆業務資料。',
                placement: 'bottom' // 提示框在元素下方，箭頭向上指
            },
            {
                selector: '#btn-export',
                title: '匯出您的成果',
                content: '當累積了足夠的數據，一鍵即可將資料匯出成精美的報表。',
                placement: 'bottom'
            }
        ];

        // 實例化導覽引擎
        const systemTour = new TourGuide(myTourSteps);

        // 頁面載入完成後檢查是否為「第一次進入」(這裡用簡單的 localStorage 模擬)
        window.addEventListener('DOMContentLoaded', () => {
            const hasSeenTour = localStorage.getItem('hasSeenTour_v1');
            
            if (!hasSeenTour) {
                // 如果沒看過，自動啟動導覽
                setTimeout(() => {
                    systemTour.start();
                    localStorage.setItem('hasSeenTour_v1', 'true'); // 標記為已看過
                }, 500); // 延遲半秒讓使用者先感受一下畫面
            }

            // 綁定重新啟動按鈕
            document.getElementById('btn-restart-tour').addEventListener('click', () => {
                systemTour.start();
            });
        });
    </script>
</body>
</html>
